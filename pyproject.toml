[project]
name = "agents"
version = "0.1.0"
description = "Agentes de IA com LangGraph e Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grandalf>=0.8",
    "ipykernel>=7.3.0",
    "langchain-core>=1.5.5",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
search_path = ["Task mAIstro"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erros)
    "W",   # pycodestyle (avisos)
    "F",   # Pyflakes
    "I",   # isort (ordenação automática de imports)
    "B",   # flake8-bugbear (bugs comuns)
    "UP",  # pyupgrade (atualização automática para sintaxe Python moderna)
]
ignore = [
    "E501", # Linhas longas (útil para prompts e docstrings extensos)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
